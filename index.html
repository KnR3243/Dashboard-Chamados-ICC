<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ICC - Chamados</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <style>
        /* ICC Dashboard: visual original restaurado + correções de dados/paginação */
        :root {
            --icc-light-green: #70b02a;
            --icc-dark-green: #2b571e;
            --glass-bg: rgba(18, 18, 18, 0.95); 
            --st-novo: #00d2ff;
            --st-atendimento: #2ecc71;
            --st-espera: #f1a90f;
            --st-pausado: #9b59b6;
            --st-default: #ffffff;
            --ranking-bg: rgba(0, 0, 0, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, var(--icc-light-green), var(--icc-dark-green));
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 100;
        }
        .header-left { display: flex; flex-direction: row; align-items: center; gap: 20px; }
        .header-left img { height: 50px; filter: brightness(0) invert(1); object-fit: contain; }
        .header-left h1 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; margin: 0; white-space: nowrap; }
        .header-right { text-align: right; }
        #data-extenso { font-size: 1rem; font-weight: 400; text-transform: capitalize; opacity: 0.9; margin-bottom: 2px;}
        #relogio { font-size: 2.4rem; font-weight: 900; letter-spacing: -2px; line-height: 1; }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
            padding: 20px 30px 25px 30px;
        }

        .col-ativos {
            flex: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .col-title {
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--st-atendimento);
            color: #fff;
            opacity: 0.9;
        }

        .grid-ativos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px 20px;
            overflow-y: auto;
            padding-right: 5px;
            padding-top: 18px;
            align-content: start;
            scrollbar-width: none; 
        }
        .grid-ativos::-webkit-scrollbar { display: none; }

        .col-direita {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        /* RANKING */
        .ranking-container {
            background: var(--ranking-bg);
            border-radius: 12px;
            padding: 15px 20px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .col-title.ranking { border-left-color: #ff3333; margin-bottom: 10px; }

        .ranking-header {
            display: grid;
            grid-template-columns: 40px 1fr 60px 80px;
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 900;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 8px;
            gap: 10px;
        }

        .ranking-list { display: flex; flex-direction: column; gap: 6px; }

        .rank-item {
            display: grid;
            grid-template-columns: 40px 1fr 60px 80px;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 8px 10px;
            border-radius: 8px;
            gap: 10px;
        }
        
        .rank-item:nth-child(1) { background: rgba(255, 51, 51, 0.15); border-left: 3px solid #ff3333; }
        .rank-item:nth-child(2) { background: rgba(241, 169, 15, 0.1); border-left: 3px solid #f1a90f; }

        .rank-pos { font-weight: 900; font-size: 1rem; color: #fff; text-align: center;}
        .rank-item:nth-child(1) .rank-pos { color: #ff3333; }
        .rank-name { font-size: 0.95rem; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .rank-tickets { font-size: 1rem; font-weight: 800; color: #38bdf8; text-align: center; }
        .rank-avg { font-size: 0.85rem; font-weight: 800; color: #f8fafc; text-align: right; }

        /* ESPERA */
        .espera-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .col-title.waiting { border-left-color: var(--st-espera); margin-bottom: 5px; }

        .marquee-vertical { flex: 1; position: relative; overflow: hidden; }

        #lista-espera {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: absolute;
            width: 100%;
            padding-top: 18px;
            animation: subir 30s linear infinite;
            will-change: transform;
        }

        @keyframes subir { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        /* CARDS */
        .card {
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 20px 15px 12px 15px;
            display: flex;
            flex-direction: column;
            min-height: 130px; 
            height: max-content; 
            position: relative;
            overflow: visible;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .status-pill {
            position: absolute;
            top: -10px;
            left: 15px;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 5;
            letter-spacing: 0.5px;
        }

        .pill-novo { background: var(--st-novo); }
        .pill-atendimento { background: var(--st-atendimento); }
        .pill-espera { background: var(--st-espera); color: #000; }
        .pill-pausado { background: var(--st-pausado); }
        .pill-default { background: var(--st-default); color: #000; }

        .ticket-header { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; margin-bottom: 6px; }
        .ticket-id { font-size: 1.05rem; color: var(--icc-light-green); font-weight: 800; letter-spacing: 0.5px; }
        .subject { font-size: 1.15rem; font-weight: 700; line-height: 1.3; color: #f1f5f9; margin-bottom: 12px; word-wrap: break-word; flex-grow: 1; }

        .card-footer {
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
        }

        .footer-col { display: flex; flex-direction: column; }
        .info-label { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; margin-bottom: 2px; }
        .info-val { font-size: 0.9rem; font-weight: 500; color: #e2e8f0; }
        .val-operator { color: #f8fafc; font-weight: 600; }

        .time-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .time-subtle { color: #94a3b8; background: rgba(255, 255, 255, 0.05); }
        .time-warning { color: #f1a90f; background: rgba(241, 169, 15, 0.1); }
        .time-critical { color: #ff3333; background: rgba(255, 51, 51, 0.1); font-weight: 900; animation: pulse-text 1.5s infinite; }

        @keyframes pulse-text { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .live-pulse { animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { border-color: rgba(0, 210, 255, 0.05); } 50% { border-color: rgba(0, 210, 255, 0.6); } 100% { border-color: rgba(0, 210, 255, 0.05); } }
        .critical-pulse { animation: pulse-critical 1s infinite; }
        @keyframes pulse-critical { 0% { border-color: rgba(255, 0, 0, 0.1); box-shadow: 0 0 0px rgba(255,0,0,0); } 50% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); } 100% { border-color: rgba(255, 0, 0, 0.1); box-shadow: 0 0 0px rgba(255,0,0,0); } }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo">
        <h1>Chamados TopDesk</h1>
    </div>
    <div class="header-right">
        <div id="data-extenso">...</div>
        <div id="relogio">00:00:00</div>
    </div>
</header>

<main>
    <section class="col-ativos">
        <h2 class="col-title">Fila Ativa (Novo / Em Atendimento)</h2>
        <div class="grid-ativos" id="grid-ativos"></div>
    </section>

    <section class="col-direita">
        <div class="ranking-container">
            <h2 class="col-title ranking">Status Operador (Geral)</h2>
            <div class="ranking-header">
                <div style="text-align: center;">Pos</div>
                <div>Operador</div>
                <div style="text-align: center;">Total</div>
                <div style="text-align: right;">Média Aberto</div>
            </div>
            <div class="ranking-list" id="ranking-list">
                </div>
        </div>

        <div class="espera-container">
            <h2 class="col-title waiting">Em Espera / Pausados</h2>
            <div class="marquee-vertical">
                <div id="lista-espera"></div>
            </div>
        </div>
    </section>
</main>

<script>
    const headers = { 'Accept': 'application/json' };
    let lastDataHash = "";

    // Busca paginada: PAGE_SIZE é o tamanho de cada página.
    // A função continua buscando até a API devolver menos itens que PAGE_SIZE.
    const PAGE_SIZE = 100;
    const SAFETY_MAX_PAGES = 200; // trava de segurança para evitar loop infinito se a API repetir páginas
    let isFetching = false;

    function escapeHTML(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function normalizeText(value) {
        return String(value || "")
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .trim()
            .toUpperCase();
    }

    function isGroupOrEmptyOperator(name) {
        const normalized = normalizeText(name);
        if (!normalized || normalized === "-") return true;

        // Quando o Topdesk devolve o grupo de atendimento em vez do operador, mostrar como nulo.
        return (
            normalized === "TI" ||
            /^T\.?I\.?$/.test(normalized) ||
            normalized.includes("TECNOLOGIA DA INFORMACAO") ||
            normalized.includes("SUPORTE TI") ||
            normalized.includes("GRUPO TI") ||
            normalized.includes("EQUIPE TI")
        );
    }

    function getOperatorName(item) {
        const candidates = [
            item.operator,
            item.simple?.operator,
            item.complex?.operator,
            item.assignee,
            item.simple?.assignee,
            item.complex?.assignee
        ];

        for (const opObj of candidates) {
            const name = (opObj?.dynamicName || opObj?.name || "").trim();
            if (!isGroupOrEmptyOperator(name)) return name;
        }

        return "-";
    }

    function getResponseList(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.results)) return data.results;
        return [];
    }

    function itemKey(item) {
        return item.id || item.number || `${item.creationDate || item.callDate || item.registeredDate || ''}|${item.briefDescription || ''}`;
    }

    function dedupeItems(items) {
        const seen = new Set();
        return items.filter(item => {
            const key = itemKey(item);
            if (!key) return true;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    }

    async function fetchTopdeskPages(basePath) {
        const allItems = [];
        const seenPageKeys = new Set();
        let page = 0;

        while (page < SAFETY_MAX_PAGES) {
            const start = page * PAGE_SIZE;
            const separator = basePath.includes('?') ? '&' : '?';
            const path = `${basePath}${separator}page_size=${PAGE_SIZE}&start=${start}`;
            const res = await fetch('/api/topdesk?path=' + encodeURIComponent(path), { headers });

            if (!res.ok) {
                console.error(`Erro na API Topdesk: ${basePath}. Status:`, res.status);
                break;
            }

            const data = await res.json();
            const list = getResponseList(data);

            if (list.length === 0) break;

            // Proteção: se a API ignorar o start e repetir a mesma página, evita loop infinito.
            const pageKey = list.map(itemKey).join('|');
            if (seenPageKeys.has(pageKey)) {
                console.warn(`Página repetida detectada em ${basePath}. Encerrando paginação.`);
                break;
            }
            seenPageKeys.add(pageKey);

            allItems.push(...list);

            // Quando vem menos que PAGE_SIZE, chegamos na última página.
            if (list.length < PAGE_SIZE) break;

            page += 1;
        }

        if (page >= SAFETY_MAX_PAGES) {
            console.warn(`Limite de segurança atingido em ${basePath}. Aumente SAFETY_MAX_PAGES se necessário.`);
        }

        return allItems;
    }

    function getStyles(status) {
        const s = (status || "").toLowerCase();
        if (s.includes('novo')) return { pill: 'pill-novo', color: '#00d2ff' };
        if (s.includes('atendimento') || s.includes('andamento')) return { pill: 'pill-atendimento', color: '#2ecc71' };
        if (s.includes('aguardando') || s.includes('fornecedor')) return { pill: 'pill-espera', color: '#f1a90f' };
        if (s.includes('pausado')) return { pill: 'pill-pausado', color: '#9b59b6' };
        return { pill: 'pill-default', color: '#7f8c8d' }; 
    }

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;

        try {
            const [incidents, operatorChanges] = await Promise.all([
                fetchTopdeskPages('incidents'),
                fetchTopdeskPages('operatorChanges')
            ]);

            const finalData = dedupeItems([...incidents, ...operatorChanges]);
            const currentHash = JSON.stringify(finalData);

            if (currentHash === lastDataHash) return;
            
            lastDataHash = currentHash;
            render(finalData);

        } catch (e) {
            console.error(e);
        } finally {
            isFetching = false;
        }
    }

    function createCardHTML(item) {
        const isM = item.number && item.number.startsWith('M');
        const idCompleto = item.number; 
        const statusName = isM ? (item.status?.name || "Novo") : (item.processingStatus?.name || "Novo");
        const style = getStyles(statusName);
        const textoPill = isM ? `MUDANÇAS: ${statusName.toUpperCase()}` : statusName.toUpperCase();
        
        const opName = getOperatorName(item);
        const solicitante = item.caller?.dynamicName || item.requester?.dynamicName || item.requestedBy?.dynamicName || "TI";

        const rawDate = item.creationDate || item.callDate || item.registeredDate;
        let timeString = "-";
        let timeClass = "time-subtle";
        let isCritical = false;

        if (rawDate) {
            const dataCriacao = new Date(rawDate);
            const diffTime = Math.max(0, new Date() - dataCriacao);
            const diffMins = Math.floor(diffTime / (1000 * 60));
            const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffMins < 60) {
                timeString = diffMins <= 1 ? "AGORA" : `HÁ ${diffMins} MIN`;
            } else if (diffHours < 24) {
                timeString = `HÁ ${diffHours}H`;
            } else {
                timeString = `HÁ ${diffDays} DIA${diffDays > 1 ? 'S' : ''}`;
            }

            if (diffDays >= 7) { isCritical = true; timeClass = "time-critical"; } 
            else if (diffDays >= 4) { timeClass = "time-warning"; }
        }

        let animationClass = isCritical ? "critical-pulse" : (statusName.toLowerCase().includes('novo') ? "live-pulse" : "");

        return `
            <div class="card ${animationClass}" style="border-color: ${isCritical ? '#ef4444' : style.color}">
                <div class="status-pill ${style.pill}">${textoPill}</div>
                <div class="ticket-header">
                    <div class="ticket-id">${escapeHTML(idCompleto)}</div>
                    <div class="time-badge ${timeClass}">${escapeHTML(timeString)}</div>
                </div>
                <div class="subject">${escapeHTML(item.briefDescription || "Sem Assunto")}</div>
                <div class="card-footer">
                    <div class="footer-col">
                        <span class="info-label">Solicitante</span>
                        <span class="info-val">${escapeHTML(solicitante)}</span>
                    </div>
                    <div class="footer-col" style="text-align: right;">
                        <span class="info-label">Atendido por</span>
                        <span class="info-val val-operator">${escapeHTML(opName)}</span>
                    </div>
                </div>
            </div>
        `;
    }

    function render(lista) {
        const gridAtivos = document.getElementById('grid-ativos');
        const listaEspera = document.getElementById('lista-espera');
        const listaRanking = document.getElementById('ranking-list');

        if (!lista || lista.length === 0) {
            gridAtivos.innerHTML = "";
            listaEspera.innerHTML = "";
            listaRanking.innerHTML = `<div class="rank-item"><span class="rank-name" style="grid-column: 1 / -1; text-align: center;">Nenhum chamado encontrado.</span></div>`;
            return;
        }

        // FILTRO GERAL: Esconde SOMENTE os fechados, resolvidos ou cancelados.
        const dadosLimpos = lista.filter(item => {
            const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
            if (s.includes('resolvido') || s.includes('fechado') || s.includes('fechada') || s.includes('cancelad')) return false;
            return true;
        });

        // ================= RANKING: SOMA TUDO (ATIVOS + ESPERA) =================
        const operadoresData = {};

        dadosLimpos.forEach(item => {
            const opName = getOperatorName(item);
            
            if (opName === "-") return;

            let nomeCurto = opName.split(" ")[0];
            const rawDate = item.creationDate || item.callDate || item.registeredDate;
            let horasAberto = 0;
            
            if (rawDate) {
                horasAberto = Math.max(0, new Date() - new Date(rawDate)) / (1000 * 60 * 60);
            }

            if (!operadoresData[nomeCurto]) {
                operadoresData[nomeCurto] = { nome: nomeCurto, totalTickets: 0, totalHoras: 0 };
            }
            operadoresData[nomeCurto].totalTickets += 1;
            operadoresData[nomeCurto].totalHoras += horasAberto;
        });

        const rankingArray = Object.values(operadoresData).map(op => {
            op.mediaHoras = op.totalHoras / op.totalTickets;
            return op;
        }).sort((a, b) => b.mediaHoras - a.mediaHoras).slice(0, 5);

        if (rankingArray.length > 0) {
            listaRanking.innerHTML = rankingArray.map((op, index) => {
                let mediaDisplay = op.mediaHoras < 24 
                    ? `${Math.floor(op.mediaHoras)}h` 
                    : `${Math.floor(op.mediaHoras / 24)} dias`;

                return `
                    <div class="rank-item">
                        <span class="rank-pos">${index + 1}º</span>
                        <span class="rank-name">${escapeHTML(op.nome)}</span>
                        <span class="rank-tickets">${escapeHTML(op.totalTickets)}</span>
                        <span class="rank-avg">${escapeHTML(mediaDisplay)}</span>
                    </div>
                `;
            }).join('');
        } else {
            listaRanking.innerHTML = `<div class="rank-item"><span class="rank-name" style="grid-column: 1 / -1; text-align: center;">Nenhum operador com chamados.</span></div>`;
        }
        // =================================================

        // Separa para as Colunas
        const espera = dadosLimpos.filter(item => {
            const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
            return s.includes('pausado') || s.includes('aguardando') || s.includes('fornecedor');
        });

        const ativos = dadosLimpos.filter(item => {
            const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
            return !(s.includes('pausado') || s.includes('aguardando') || s.includes('fornecedor'));
        });

        gridAtivos.innerHTML = ativos.map(i => createCardHTML(i)).join('');

        // Ao atualizar a lista, volta para o topo para evitar card renderizado já cortado.
        gridAtivos.scrollTop = 0;
        scrollDir = 1;
        isPaused = true;
        setTimeout(() => { isPaused = false; }, 1200);
        
        const htmlEspera = espera.map(i => createCardHTML(i)).join('');
        listaEspera.innerHTML = htmlEspera + htmlEspera;

        const duration = Math.max(20, espera.length * 4); 
        listaEspera.style.animationDuration = `${duration}s`;
    }

    function clock() {
        const agora = new Date();
        const opt = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        const dataStr = agora.toLocaleDateString('pt-BR', opt);
        document.getElementById('data-extenso').innerText = dataStr.charAt(0).toUpperCase() + dataStr.slice(1);
        document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
    }

    let scrollDir = 1;
    let isPaused = false;
    let scrollAccumulator = 0;
    const speed = 0.5;
    let gridAtivosEl = null;

    function smoothScroll() {
        if (!gridAtivosEl) gridAtivosEl = document.getElementById('grid-ativos');

        if (!isPaused && gridAtivosEl && gridAtivosEl.scrollHeight > gridAtivosEl.clientHeight) {
            scrollAccumulator += speed;
            if (scrollAccumulator >= 1) { gridAtivosEl.scrollTop += scrollDir; scrollAccumulator = 0; }
            
            if (scrollDir === 1 && Math.ceil(gridAtivosEl.scrollTop + gridAtivosEl.clientHeight) >= gridAtivosEl.scrollHeight) {
                isPaused = true; scrollDir = -1; setTimeout(() => { isPaused = false; }, 2400);
            } 
            else if (scrollDir === -1 && gridAtivosEl.scrollTop <= 0) {
                isPaused = true; scrollDir = 1; setTimeout(() => { isPaused = false; }, 2400);
            }
        }
        requestAnimationFrame(smoothScroll);
    }

    setInterval(clock, 1000);
    setInterval(fetchData, 15000);
    requestAnimationFrame(smoothScroll);

    clock();
    fetchData();
</script>
</body>
</html>
