<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>ICC - Chamados</title>
    <link rel="icon" href="/icone.png" type="image/png">
    <style>
        :root {
            --icc-light-green: #70b02a;
            --icc-dark-green: #2b571e;
            --glass-bg: rgba(14, 18, 15, 0.92);
            --panel-bg: rgba(0, 0, 0, 0.34);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --st-novo: #00d2ff;
            --st-atendimento: #2ecc71;
            --st-espera: #f1a90f;
            --st-pausado: #9b59b6;
            --st-default: #ffffff;
            --ranking-bg: rgba(0, 0, 0, 0.36);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background:
                linear-gradient(rgba(0, 0, 0, 0.84), rgba(0, 0, 0, 0.84)),
                url('/fundo.jpg') no-repeat center center;
            background-size: cover;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-rendering: optimizeLegibility;
        }

        header {
            background: linear-gradient(90deg, var(--icc-light-green), var(--icc-dark-green));
            min-height: 78px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.42);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 100;
        }

        .header-left {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 18px;
            min-width: 0;
        }

        .header-left img {
            height: 48px;
            filter: brightness(0) invert(1);
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-left h1 {
            font-size: 1.55rem;
            font-weight: 850;
            text-transform: uppercase;
            margin: 0;
            white-space: nowrap;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
        }

        .header-right {
            text-align: right;
            flex-shrink: 0;
        }

        #data-extenso {
            font-size: 0.95rem;
            font-weight: 500;
            text-transform: capitalize;
            opacity: 0.92;
            margin-bottom: 2px;
        }

        #relogio {
            font-size: 2.28rem;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 18px;
            padding: 18px 24px 22px 24px;
        }

        .col-ativos {
            flex: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .col-title {
            font-size: 1.02rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 12px;
            padding-left: 10px;
            border-left: 4px solid var(--st-atendimento);
            color: #ffffff;
            opacity: 0.94;
            letter-spacing: 0.35px;
            line-height: 1.2;
        }

        .grid-ativos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 16px 18px;
            overflow-y: auto;
            padding: 16px 6px 10px 0;
            align-content: start;
            scrollbar-width: none;
        }

        .grid-ativos::-webkit-scrollbar {
            display: none;
        }

        .col-direita {
            flex: 1;
            min-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        /* RANKING */
        .ranking-container {
            background: var(--ranking-bg);
            border-radius: 14px;
            padding: 14px 16px 15px 16px;
            border: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26);
        }

        .col-title.ranking {
            border-left-color: #ef4444;
            margin-bottom: 10px;
        }

        .ranking-header {
            display: grid;
            grid-template-columns: 38px 1fr 56px 78px;
            font-size: 0.62rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 900;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
            margin-bottom: 8px;
            gap: 8px;
            letter-spacing: 0.35px;
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .rank-item {
            display: grid;
            grid-template-columns: 38px 1fr 56px 78px;
            align-items: center;
            background: rgba(255, 255, 255, 0.045);
            padding: 8px 9px;
            border-radius: 9px;
            gap: 8px;
            border-left: 3px solid rgba(255, 255, 255, 0.08);
        }

        .rank-item:nth-child(1) {
            background: rgba(239, 68, 68, 0.14);
            border-left-color: #ef4444;
        }

        .rank-item:nth-child(2) {
            background: rgba(241, 169, 15, 0.11);
            border-left-color: #f1a90f;
        }

        .rank-pos {
            font-weight: 900;
            font-size: 0.98rem;
            color: #ffffff;
            text-align: center;
        }

        .rank-item:nth-child(1) .rank-pos {
            color: #ff5c5c;
        }

        .rank-name {
            font-size: 0.92rem;
            font-weight: 750;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-tickets {
            font-size: 0.96rem;
            font-weight: 850;
            color: #38bdf8;
            text-align: center;
        }

        .rank-avg {
            font-size: 0.82rem;
            font-weight: 850;
            color: #f8fafc;
            text-align: right;
        }

        /* ESPERA */
        .espera-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border-radius: 14px;
            padding: 14px 16px 16px 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.23);
        }

        .col-title.waiting {
            border-left-color: var(--st-espera);
            margin-bottom: 4px;
        }

        .marquee-vertical {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #lista-espera {
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: absolute;
            width: 100%;
            padding-top: 16px;
            animation: subir 30s linear infinite;
            will-change: transform;
        }

        @keyframes subir {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        /* CARDS */
        .card {
            background-color: var(--glass-bg);
            border-radius: 13px;
            padding: 19px 15px 12px 15px;
            display: flex;
            flex-direction: column;
            min-height: 128px;
            height: max-content;
            position: relative;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.08);
            contain: layout paint;
        }

        .status-pill {
            position: absolute;
            top: -10px;
            left: 14px;
            padding: 4px 11px;
            border-radius: 8px;
            font-size: 0.62rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
            z-index: 5;
            letter-spacing: 0.5px;
            line-height: 1.2;
            max-width: calc(100% - 28px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pill-novo {
            background: var(--st-novo);
        }

        .pill-atendimento {
            background: var(--st-atendimento);
        }

        .pill-espera {
            background: var(--st-espera);
            color: #111827;
        }

        .pill-pausado {
            background: var(--st-pausado);
        }

        .pill-default {
            background: var(--st-default);
            color: #111827;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            margin-bottom: 7px;
        }

        .ticket-id {
            font-size: 1.02rem;
            color: var(--icc-light-green);
            font-weight: 850;
            letter-spacing: 0.45px;
            white-space: nowrap;
        }

        .subject {
            font-size: 1.08rem;
            font-weight: 700;
            line-height: 1.28;
            color: #f1f5f9;
            margin-bottom: 12px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            flex-grow: 1;
        }

        .card-footer {
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .footer-col:last-child {
            align-items: flex-end;
        }

        .info-label {
            font-size: 0.58rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 850;
            margin-bottom: 2px;
            letter-spacing: 0.4px;
        }

        .info-val {
            font-size: 0.86rem;
            font-weight: 500;
            color: #e2e8f0;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .val-operator {
            color: #f8fafc;
            font-weight: 650;
        }

        .time-badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 7px;
            white-space: nowrap;
        }

        .time-subtle {
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.055);
        }

        .time-warning {
            color: #f1a90f;
            background: rgba(241, 169, 15, 0.11);
        }

        .time-critical {
            color: #ff4b4b;
            background: rgba(255, 51, 51, 0.11);
            font-weight: 900;
            animation: pulse-text 1.5s infinite;
        }

        .empty-state {
            color: #94a3b8;
            font-size: 0.92rem;
            font-weight: 700;
            text-align: center;
            padding: 18px 12px;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.035);
        }

        @keyframes pulse-text {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.55;
            }
        }

        .live-pulse {
            animation: pulse-border 2s infinite;
            will-change: border-color;
        }

        @keyframes pulse-border {

            0%,
            100% {
                border-color: rgba(0, 210, 255, 0.22);
            }

            50% {
                border-color: rgba(0, 210, 255, 0.82);
            }
        }

        .critical-pulse {
            animation: pulse-critical 1s infinite;
            will-change: border-color, box-shadow;
        }

        @keyframes pulse-critical {

            0%,
            100% {
                border-color: rgba(255, 0, 0, 0.18);
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.34);
            }

            50% {
                border-color: #ef4444;
                box-shadow: 0 8px 20px rgba(239, 68, 68, 0.25);
            }
        }

        @media (max-width: 1180px) {
            main {
                padding: 16px 18px 20px 18px;
                gap: 14px;
            }

            .grid-ativos {
                grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            }

            .col-direita {
                min-width: 315px;
            }

            .subject {
                font-size: 1.02rem;
            }
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }

            header {
                padding: 0 18px;
            }

            main {
                flex-direction: column;
                overflow: visible;
            }

            .col-ativos,
            .col-direita {
                overflow: visible;
                min-width: 0;
            }

            .grid-ativos {
                overflow: visible;
            }

            .espera-container {
                min-height: 420px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-left">
            <img src="/icone.png" alt="Logo">
            <h1>Chamados TopDesk</h1>
        </div>
        <div class="header-right">
            <div id="data-extenso">...</div>
            <div id="relogio">00:00:00</div>
        </div>
    </header>

    <main>
        <section class="col-ativos">
            <h2 class="col-title">Fila Ativa (Novo / Em Atendimento)</h2>
            <div class="grid-ativos" id="grid-ativos"></div>
        </section>

        <section class="col-direita">
            <div class="ranking-container">
                <h2 class="col-title ranking">Status Operador (Geral)</h2>
                <div class="ranking-header">
                    <div style="text-align: center;">Pos</div>
                    <div>Operador</div>
                    <div style="text-align: center;">Total</div>
                    <div style="text-align: right;">Média Aberto</div>
                </div>
                <div class="ranking-list" id="ranking-list"></div>
            </div>

            <div class="espera-container">
                <h2 class="col-title waiting">Em Espera / Pausados</h2>
                <div class="marquee-vertical">
                    <div id="lista-espera"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Deploy marker: dashboard-index-2026-06-03-paginacao-visual-leve
        const PAGE_SIZE = 100;
        const SAFETY_MAX_PAGES = 200;

        let lastDataHash = "";
        let gridAtivosEl = null;

        function normalizeText(value) {
            return String(value || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .trim()
                .toUpperCase();
        }

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getStyles(status) {
            const s = (status || "").toLowerCase();
            if (s.includes('novo')) return { pill: 'pill-novo', color: '#00d2ff' };
            if (s.includes('atendimento') || s.includes('andamento')) return { pill: 'pill-atendimento', color: '#2ecc71' };
            if (s.includes('aguardando') || s.includes('fornecedor')) return { pill: 'pill-espera', color: '#f1a90f' };
            if (s.includes('pausado')) return { pill: 'pill-pausado', color: '#9b59b6' };
            return { pill: 'pill-default', color: '#7f8c8d' };
        }

        function getStatusName(item) {
            const isM = item.number && item.number.startsWith('M');
            return isM ? (item.status?.name || "Novo") : (item.processingStatus?.name || "Novo");
        }

        function getItemKey(item) {
            return item.number || item.id || item.unid || item.href || JSON.stringify(item);
        }

        function normalizeApiList(data) {
            if (Array.isArray(data)) return data;
            if (Array.isArray(data?.results)) return data.results;
            if (Array.isArray(data?.data)) return data.data;
            return [];
        }

        function isGenericOperatorName(name) {
            const upper = normalizeText(name);

            if (!upper) return true;
            if (upper === "-" || upper === "TI" || upper === "T.I" || upper === "T.I.") return true;
            if (upper === "TECNOLOGIA DA INFORMACAO") return true;
            if (upper === "EQUIPE TI" || upper === "SUPORTE TI" || upper === "GRUPO TI") return true;
            if (upper.includes("TECNOLOGIA DA INFORMACAO")) return true;

            return false;
        }

        function getOperatorName(item) {
            const opObj = item.operator || item.assignee || item.simple?.assignee || item.complex?.assignee;
            const rawName = opObj?.dynamicName || opObj?.name || "";

            if (isGenericOperatorName(rawName)) return "-";

            return String(rawName).trim();
        }

        function getShortOperatorName(item) {
            const opName = getOperatorName(item);
            if (opName === "-") return "-";
            return opName.split(" ")[0];
        }

        async function fetchTopdeskPath(path) {
            const response = await fetch('/api/topdesk?path=' + encodeURIComponent(path), {
                headers: { 'Accept': 'application/json' }
            });

            if (!response.ok) {
                console.error("Erro na API TOPdesk:", response.status, path);
                return [];
            }

            return await response.json();
        }

        async function fetchAllPages(resource) {
            const allItems = [];
            let start = 0;
            let previousFirstKey = "";

            for (let page = 0; page < SAFETY_MAX_PAGES; page++) {
                const separator = resource.includes("?") ? "&" : "?";
                const path = `${resource}${separator}page_size=${PAGE_SIZE}&start=${start}`;
                const data = await fetchTopdeskPath(path);
                const list = normalizeApiList(data);

                if (!list.length) break;

                const firstKey = getItemKey(list[0]);

                if (page > 0 && firstKey && firstKey === previousFirstKey && list.length === PAGE_SIZE) {
                    console.warn("Paginação repetida detectada. Interrompendo para evitar loop:", resource);
                    break;
                }

                previousFirstKey = firstKey;
                allItems.push(...list);

                if (list.length < PAGE_SIZE) break;

                start += PAGE_SIZE;
            }

            return allItems;
        }

        function deduplicateItems(items) {
            const map = new Map();

            items.forEach(item => {
                const key = getItemKey(item);
                if (!map.has(key)) map.set(key, item);
            });

            return Array.from(map.values());
        }

        function createDataHash(items) {
            return JSON.stringify(items.map(item => ({
                n: item.number || item.id || "",
                s: getStatusName(item),
                o: getOperatorName(item),
                d: item.creationDate || item.callDate || item.registeredDate || "",
                b: item.briefDescription || ""
            })));
        }

        async function fetchData() {
            try {
                const [incidents, changes] = await Promise.all([
                    fetchAllPages('incidents'),
                    fetchAllPages('operatorChanges')
                ]);

                const finalData = deduplicateItems([...incidents, ...changes]);
                const currentHash = createDataHash(finalData);

                if (currentHash === lastDataHash) return;

                lastDataHash = currentHash;
                render(finalData);

            } catch (e) {
                console.error("Erro ao buscar dados:", e);
            }
        }

        function createCardHTML(item) {
            const isM = item.number && item.number.startsWith('M');
            const idCompleto = item.number || "-";
            const statusName = getStatusName(item);
            const style = getStyles(statusName);
            const textoPill = isM ? `MUDANÇAS: ${statusName.toUpperCase()}` : statusName.toUpperCase();

            const opName = getOperatorName(item);
            const solicitante = item.caller?.dynamicName || item.requester?.dynamicName || item.requestedBy?.dynamicName || "TI";

            const rawDate = item.creationDate || item.callDate || item.registeredDate;
            let timeString = "-";
            let timeClass = "time-subtle";
            let isCritical = false;

            if (rawDate) {
                const dataCriacao = new Date(rawDate);
                const diffTime = Math.max(0, new Date() - dataCriacao);
                const diffMins = Math.floor(diffTime / (1000 * 60));
                const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                if (diffMins < 60) {
                    timeString = diffMins <= 1 ? "AGORA" : `HÁ ${diffMins} MIN`;
                } else if (diffHours < 24) {
                    timeString = `HÁ ${diffHours}H`;
                } else {
                    timeString = `HÁ ${diffDays} DIA${diffDays > 1 ? 'S' : ''}`;
                }

                if (diffDays >= 7) {
                    isCritical = true;
                    timeClass = "time-critical";
                } else if (diffDays >= 4) {
                    timeClass = "time-warning";
                }
            }

            const animationClass = isCritical ? "critical-pulse" : (statusName.toLowerCase().includes('novo') ? "live-pulse" : "");

            return `
            <div class="card ${animationClass}" style="border-color: ${isCritical ? '#ef4444' : style.color}">
                <div class="status-pill ${style.pill}">${escapeHTML(textoPill)}</div>
                <div class="ticket-header">
                    <div class="ticket-id">${escapeHTML(idCompleto)}</div>
                    <div class="time-badge ${timeClass}">${escapeHTML(timeString)}</div>
                </div>
                <div class="subject">${escapeHTML(item.briefDescription || "Sem Assunto")}</div>
                <div class="card-footer">
                    <div class="footer-col">
                        <span class="info-label">Solicitante</span>
                        <span class="info-val">${escapeHTML(solicitante)}</span>
                    </div>
                    <div class="footer-col" style="text-align: right;">
                        <span class="info-label">Atendido por</span>
                        <span class="info-val val-operator">${escapeHTML(opName)}</span>
                    </div>
                </div>
            </div>
        `;
        }

        function render(lista) {
            const gridAtivos = document.getElementById('grid-ativos');
            const listaEspera = document.getElementById('lista-espera');
            const listaRanking = document.getElementById('ranking-list');

            if (!lista || lista.length === 0) {
                gridAtivos.innerHTML = `<div class="empty-state">Nenhum chamado ativo encontrado.</div>`;
                listaEspera.innerHTML = `<div class="empty-state">Nenhum chamado em espera.</div>`;
                listaRanking.innerHTML = `<div class="rank-item"><span class="rank-name" style="grid-column: 1 / -1; text-align: center;">Nenhum operador com chamados.</span></div>`;
                return;
            }

            const dadosLimpos = lista.filter(item => {
                const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
                if (s.includes('resolvido') || s.includes('fechado') || s.includes('fechada') || s.includes('cancelad')) return false;
                return true;
            });

            const operadoresData = {};

            dadosLimpos.forEach(item => {
                const opName = getShortOperatorName(item);
                if (opName === "-") return;

                const rawDate = item.creationDate || item.callDate || item.registeredDate;
                let horasAberto = 0;

                if (rawDate) {
                    horasAberto = Math.max(0, new Date() - new Date(rawDate)) / (1000 * 60 * 60);
                }

                if (!operadoresData[opName]) {
                    operadoresData[opName] = { nome: opName, totalTickets: 0, totalHoras: 0 };
                }

                operadoresData[opName].totalTickets += 1;
                operadoresData[opName].totalHoras += horasAberto;
            });

            const rankingArray = Object.values(operadoresData).map(op => {
                op.mediaHoras = op.totalTickets > 0 ? op.totalHoras / op.totalTickets : 0;
                return op;
            }).sort((a, b) => b.mediaHoras - a.mediaHoras).slice(0, 5);

            if (rankingArray.length > 0) {
                listaRanking.innerHTML = rankingArray.map((op, index) => {
                    const mediaDisplay = op.mediaHoras < 24
                        ? `${Math.floor(op.mediaHoras)}h`
                        : `${Math.floor(op.mediaHoras / 24)} dias`;

                    return `
                    <div class="rank-item">
                        <span class="rank-pos">${index + 1}º</span>
                        <span class="rank-name">${escapeHTML(op.nome)}</span>
                        <span class="rank-tickets">${op.totalTickets}</span>
                        <span class="rank-avg">${escapeHTML(mediaDisplay)}</span>
                    </div>
                `;
                }).join('');
            } else {
                listaRanking.innerHTML = `<div class="rank-item"><span class="rank-name" style="grid-column: 1 / -1; text-align: center;">Nenhum operador com chamados.</span></div>`;
            }

            const espera = dadosLimpos.filter(item => {
                const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
                return s.includes('pausado') || s.includes('aguardando') || s.includes('fornecedor');
            });

            const ativos = dadosLimpos.filter(item => {
                const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
                return !(s.includes('pausado') || s.includes('aguardando') || s.includes('fornecedor'));
            });

            gridAtivos.innerHTML = ativos.length
                ? ativos.map(i => createCardHTML(i)).join('')
                : `<div class="empty-state">Nenhum chamado ativo encontrado.</div>`;

            const htmlEspera = espera.length
                ? espera.map(i => createCardHTML(i)).join('')
                : `<div class="empty-state">Nenhum chamado em espera.</div>`;

            listaEspera.innerHTML = espera.length ? htmlEspera + htmlEspera : htmlEspera;

            const duration = Math.max(22, espera.length * 4);
            listaEspera.style.animationDuration = `${duration}s`;
        }

        function clock() {
            const agora = new Date();
            const opt = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            const dataStr = agora.toLocaleDateString('pt-BR', opt);
            document.getElementById('data-extenso').innerText = dataStr.charAt(0).toUpperCase() + dataStr.slice(1);
            document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
        }

        let scrollDir = 1;
        let isPaused = false;
        let scrollAccumulator = 0;
        const speed = 0.5;

        function smoothScroll() {
            if (!gridAtivosEl) gridAtivosEl = document.getElementById('grid-ativos');

            if (!isPaused && gridAtivosEl && gridAtivosEl.scrollHeight > gridAtivosEl.clientHeight) {
                scrollAccumulator += speed;

                if (scrollAccumulator >= 1) {
                    gridAtivosEl.scrollTop += scrollDir;
                    scrollAccumulator = 0;
                }

                if (scrollDir === 1 && Math.ceil(gridAtivosEl.scrollTop + gridAtivosEl.clientHeight) >= gridAtivosEl.scrollHeight) {
                    isPaused = true;
                    scrollDir = -1;
                    setTimeout(() => { isPaused = false; }, 2500);
                } else if (scrollDir === -1 && gridAtivosEl.scrollTop <= 0) {
                    isPaused = true;
                    scrollDir = 1;
                    setTimeout(() => { isPaused = false; }, 2500);
                }
            }

            requestAnimationFrame(smoothScroll);
        }

        setInterval(clock, 1000);
        setInterval(fetchData, 15000);
        requestAnimationFrame(smoothScroll);

        clock();
        fetchData();
    </script>
</body>

</html>
