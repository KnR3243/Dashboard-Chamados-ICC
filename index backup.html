<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ICC - Chamados</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <style>
        :root {
            --icc-light-green: #70b02a;
            --icc-dark-green: #2b571e;
            --glass-bg: rgba(18, 18, 18, 0.95); 
            --st-novo: #00d2ff;
            --st-atendimento: #2ecc71;
            --st-espera: #f1a90f;
            --st-pausado: #9b59b6;
            --st-default: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: linear-gradient(to right, var(--icc-light-green), var(--icc-dark-green));
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 100;
        }
        .header-left { display: flex; flex-direction: row; align-items: center; gap: 20px; }
        .header-left img { height: 50px; filter: brightness(0) invert(1); object-fit: contain; }
        .header-left h1 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; margin: 0; white-space: nowrap; }
        .header-right { text-align: right; }
        #data-extenso { font-size: 1rem; font-weight: 400; text-transform: capitalize; opacity: 0.9; margin-bottom: 2px;}
        #relogio { font-size: 2.4rem; font-weight: 900; letter-spacing: -2px; line-height: 1; }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
            padding: 20px 30px 25px 30px;
        }

        .col-ativos {
            flex: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .col-title {
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid var(--st-atendimento);
            color: #fff;
            opacity: 0.9;
        }

        .grid-ativos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px 20px;
            overflow-y: auto;
            padding-right: 5px;
            padding-top: 10px;
            align-content: start;
            scrollbar-width: none; 
        }
        .grid-ativos::-webkit-scrollbar { display: none; }

        .col-espera {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .col-title.waiting { border-left-color: var(--st-espera); }

        .marquee-vertical {
            flex: 1;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        #lista-espera {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: absolute;
            width: 100%;
            padding-top: 10px;
            animation: subir 30s linear infinite;
            will-change: transform;
        }

        @keyframes subir {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .card {
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: 12px;
            padding: 20px 15px 12px 15px;
            display: flex;
            flex-direction: column;
            min-height: 130px; 
            height: max-content; 
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .status-pill {
            position: absolute;
            top: -10px;
            left: 15px;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 5;
            letter-spacing: 0.5px;
        }

        .pill-novo { background: var(--st-novo); }
        .pill-atendimento { background: var(--st-atendimento); }
        .pill-espera { background: var(--st-espera); color: #000; }
        .pill-pausado { background: var(--st-pausado); }
        .pill-default { background: var(--st-default); color: #000; }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            margin-bottom: 6px;
        }
        
        .ticket-id { 
            font-size: 1.05rem; 
            color: var(--icc-light-green); 
            font-weight: 800; 
            letter-spacing: 0.5px;
        }
        
        .subject {
            font-size: 1.15rem; 
            font-weight: 700;
            line-height: 1.3;
            color: #f1f5f9;
            margin-bottom: 12px;
            word-wrap: break-word;
            flex-grow: 1; 
        }

        .card-footer {
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
        }

        .footer-col { display: flex; flex-direction: column; }

        .info-label { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; margin-bottom: 2px; }
        .info-val { font-size: 0.9rem; font-weight: 500; color: #e2e8f0; }
        .val-operator { color: #f8fafc; font-weight: 600; }

        .time-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .time-subtle { color: #94a3b8; background: rgba(255, 255, 255, 0.05); }
        .time-warning { color: #f1a90f; background: rgba(241, 169, 15, 0.1); }
        .time-critical { color: #ff3333; background: rgba(255, 51, 51, 0.1); font-weight: 900; animation: pulse-text 1.5s infinite; }

        @keyframes pulse-text {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .live-pulse { animation: pulse-border 2s infinite; }
        @keyframes pulse-border {
            0% { border-color: rgba(0, 210, 255, 0.05); }
            50% { border-color: rgba(0, 210, 255, 0.6); }
            100% { border-color: rgba(0, 210, 255, 0.05); }
        }

        .critical-pulse { animation: pulse-critical 1s infinite; }
        @keyframes pulse-critical {
            0% { border-color: rgba(255, 0, 0, 0.1); box-shadow: 0 0 0px rgba(255,0,0,0); }
            50% { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
            100% { border-color: rgba(255, 0, 0, 0.1); box-shadow: 0 0 0px rgba(255,0,0,0); }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img src="logo.png" alt="Logo">
        <h1>Chamados TopDesk</h1>
    </div>
    <div class="header-right">
        <div id="data-extenso">...</div>
        <div id="relogio">00:00:00</div>
    </div>
</header>

<main>
    <section class="col-ativos">
        <h2 class="col-title">Fila Ativa (Novo / Em Atendimento)</h2>
        <div class="grid-ativos" id="grid-ativos"></div>
    </section>

    <section class="col-espera">
        <h2 class="col-title waiting">Em Espera / Pausados</h2>
        <div class="marquee-vertical">
            <div id="lista-espera"></div>
        </div>
    </section>
</main>

<script>
    const headers = { 'Accept': 'application/json' };
    let lastDataHash = "";

    function getStyles(status) {
        const s = (status || "").toLowerCase();
        if (s.includes('novo')) return { pill: 'pill-novo', color: '#00d2ff' };
        if (s.includes('atendimento') || s.includes('andamento')) return { pill: 'pill-atendimento', color: '#2ecc71' };
        if (s.includes('aguardando') || s.includes('fornecedor')) return { pill: 'pill-espera', color: '#f1a90f' };
        if (s.includes('pausado')) return { pill: 'pill-pausado', color: '#9b59b6' };
        return { pill: 'pill-default', color: '#7f8c8d' }; 
    }

    async function fetchData() {
        try {
            const [resInc, resChange] = await Promise.all([
                fetch('/api/topdesk?path=incidents?page_size=100'),
                fetch('/api/topdesk?path=operatorChanges')
            ]);

            let finalData = [];

            if (resInc.ok) {
                const data = await resInc.json();
                if (Array.isArray(data)) finalData.push(...data);
            }

            if (resChange.ok) {
                const dataM = await resChange.json();
                const listM = Array.isArray(dataM) ? dataM : (dataM.results || []);
                finalData.push(...listM);
            }

            const currentHash = JSON.stringify(finalData);
            if (currentHash === lastDataHash) return;
            
            lastDataHash = currentHash;
            render(finalData);

        } catch (e) {
            console.error(e);
        }
    }

    function createCardHTML(item) {
        const isM = item.number && item.number.startsWith('M');
        const idCompleto = item.number; 
        
        const statusName = isM ? (item.status?.name || "Novo") : (item.processingStatus?.name || "Novo");
        const style = getStyles(statusName);
        const textoPill = isM ? `MUDANÇAS: ${statusName.toUpperCase()}` : statusName.toUpperCase();
        
        let opObj = item.operator || item.assignee || item.simple?.assignee || item.complex?.assignee;
        let opName = opObj?.dynamicName || opObj?.name || "-";
        if (opName.toUpperCase().includes("TI") || opName === "") opName = "-";

        const solicitante = item.caller?.dynamicName || item.requester?.dynamicName || item.requestedBy?.dynamicName || "TI";

        const rawDate = item.creationDate || item.callDate || item.registeredDate;
        let timeString = "-";
        let timeClass = "time-subtle";
        let isCritical = false;

        if (rawDate) {
            const dataCriacao = new Date(rawDate);
            const diffTime = Math.max(0, new Date() - dataCriacao);
            const diffMins = Math.floor(diffTime / (1000 * 60));
            const diffHours = Math.floor(diffTime / (1000 * 60 * 60));
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            if (diffMins < 60) {
                timeString = diffMins <= 1 ? "AGORA" : `HÁ ${diffMins} MIN`;
            } else if (diffHours < 24) {
                timeString = `HÁ ${diffHours}H`;
            } else {
                timeString = `HÁ ${diffDays} DIA${diffDays > 1 ? 'S' : ''}`;
            }

            if (diffDays >= 7) {
                isCritical = true;
                timeClass = "time-critical";
            } else if (diffDays >= 4) {
                timeClass = "time-warning";
            }
        }

        let animationClass = "";
        if (isCritical) {
            animationClass = "critical-pulse";
        } else if (statusName.toLowerCase().includes('novo')) {
            animationClass = "live-pulse";
        }

        return `
            <div class="card ${animationClass}" style="border-color: ${isCritical ? '#ef4444' : style.color}">
                <div class="status-pill ${style.pill}">${textoPill}</div>
                
                <div class="ticket-header">
                    <div class="ticket-id">${idCompleto}</div>
                    <div class="time-badge ${timeClass}">${timeString}</div>
                </div>
                
                <div class="subject">${item.briefDescription || "Sem Assunto"}</div>
                
                <div class="card-footer">
                    <div class="footer-col">
                        <span class="info-label">Solicitante</span>
                        <span class="info-val">${solicitante}</span>
                    </div>
                    <div class="footer-col" style="text-align: right;">
                        <span class="info-label">Atendido por</span>
                        <span class="info-val val-operator">${opName}</span>
                    </div>
                </div>
            </div>
        `;
    }

    function render(lista) {
        const gridAtivos = document.getElementById('grid-ativos');
        const listaEspera = document.getElementById('lista-espera');

        if (!lista || lista.length === 0) return;

        const dadosLimpos = lista.filter(item => {
            const isM = item.number && item.number.startsWith('M');
            const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
            
            if (s.includes('resolvido') || s.includes('fechado') || s.includes('fechada')) return false;
            if (isM && !s.includes('novo') && !s.includes('andamento') && !s.includes('pausado')) return false;

            return true;
        });

        const ativos = dadosLimpos.filter(item => {
            const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
            return s.includes('novo') || s.includes('atendimento') || s.includes('andamento');
        });

        const espera = dadosLimpos.filter(item => {
            const s = (item.processingStatus?.name || item.status?.name || "").toLowerCase();
            return s.includes('pausado') || s.includes('aguardando') || s.includes('fornecedor');
        });

        gridAtivos.innerHTML = ativos.map(i => createCardHTML(i)).join('');
        
        const htmlEspera = espera.map(i => createCardHTML(i)).join('');
        listaEspera.innerHTML = htmlEspera + htmlEspera;

        const duration = Math.max(20, espera.length * 4); 
        listaEspera.style.animationDuration = `${duration}s`;
    }

    function clock() {
        const agora = new Date();
        const opt = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        const dataStr = agora.toLocaleDateString('pt-BR', opt);
        document.getElementById('data-extenso').innerText = dataStr.charAt(0).toUpperCase() + dataStr.slice(1);
        document.getElementById('relogio').innerText = agora.toLocaleTimeString('pt-BR');
    }

    // SCROLL FLUIDO ANTI-LAG (Utilizando requestAnimationFrame)
    let scrollDir = 1;
    let isPaused = false;
    let scrollAccumulator = 0;
    const speed = 0.5; // Ajuste fino da velocidade (menor = mais devagar)

    function smoothScroll() {
        if (!isPaused) {
            const el = document.getElementById('grid-ativos');
            if (el && el.scrollHeight > el.clientHeight) {
                scrollAccumulator += speed;
                
                if (scrollAccumulator >= 1) {
                    el.scrollTop += scrollDir;
                    scrollAccumulator = 0;
                }
                
                if (scrollDir === 1 && Math.ceil(el.scrollTop + el.clientHeight) >= el.scrollHeight) {
                    isPaused = true;
                    scrollDir = -1;
                    setTimeout(() => { isPaused = false; }, 2500);
                } 
                else if (scrollDir === -1 && el.scrollTop <= 0) {
                    isPaused = true;
                    scrollDir = 1;
                    setTimeout(() => { isPaused = false; }, 2500);
                }
            }
        }
        requestAnimationFrame(smoothScroll);
    }

    setInterval(clock, 1000);
    setInterval(fetchData, 15000);
    requestAnimationFrame(smoothScroll); // Inicia o motor de animação contínua

    clock();
    fetchData();
</script>
</body>
</html>
